name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  packages: write
jobs:
  test:
    # the tests run in the image itself: SANE, Tesseract, poppler, zbar, Pillow as on the box
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dokumente:test -f Containerfile .
      - run: docker run --rm -v "$PWD:/src:ro" -w /src --entrypoint python3 dokumente:test -B -m unittest scan/tests/test_scan.py vertraege/tests/test_vertraege.py tests/test_dienst.py ordnen/tests/test_ordnen.py ordnen/tests/test_doppelt.py ordnen/tests/test_zuteilen.py ordnen/tests/test_berichtigen.py ordnen/tests/test_firmen.py ordnen/tests/test_kontakte_aufraeumen.py ordnen/tests/test_kontakte_nachlesen.py vertraege/tests/test_kontakte_abgleich.py
      # the image as laib starts it: dienst.py finds scan.py and vertraege.py beside it in /opt
      - run: docker run --rm --entrypoint python3 dokumente:test -c "import sys; sys.path.insert(0, '/opt'); import dienst; a = dienst.Auswertung({}); assert dienst.scan.__file__ == '/opt/scan.py' and a.skript == '/opt/vertraege.py' and a.ordnen == '/opt/ordnen.py' and a.doppelt == '/opt/doppelt.py' and a.zuteilen == '/opt/zuteilen.py', (dienst.scan.__file__, a.skript, a.ordnen, a.doppelt, a.zuteilen); print('ok')"
      # vertraege.py and kontakte_aufraeumen.py find firmen.py (and it ordnen.py) beside them in /opt
      - run: docker run --rm --entrypoint python3 dokumente:test -c "import importlib.util as u; [u.spec_from_file_location(n, '/opt/%s.py' % n).loader.exec_module(u.module_from_spec(u.spec_from_file_location(n, '/opt/%s.py' % n))) for n in ('vertraege', 'kontakte_aufraeumen', 'kontakte_nachlesen', 'zuteilen')]; print('ok')"
      - run: docker run --rm --entrypoint python3 dokumente:test /opt/kontakte_aufraeumen.py --help
      - run: docker run --rm --entrypoint python3 dokumente:test /opt/kontakte_nachlesen.py --help
  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # cosign signs keyless with this workflow's identity (Laib ADR 0034)
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        name: the version Laib shows the family between two images
        run: echo "version=$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          tags: ghcr.io/mdopp/dokumente:latest,ghcr.io/mdopp/dokumente:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
      - uses: sigstore/cosign-installer@v3
      - name: sign the image; Laib proposes a new digest of ours only with this signature (Laib ADR 0034)
        run: cosign sign --yes ghcr.io/mdopp/dokumente@${{ steps.build.outputs.digest }}
